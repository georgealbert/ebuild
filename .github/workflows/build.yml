name: master build of MacOS Intel x86_64 GNU Emacs

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 1,16 * *'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Uninstall Homebrew
        run: |
          curl -O https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Install GNU M4
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/m4/m4-1.4.21.tar.xz --retry 3
          tar -Jxf m4-1.4.21.tar.xz && cd m4-1.4.21
          ./configure && make -j4
          sudo make install
      - name: Install GNU Autoconf
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz --retry 3
          tar -Jxf autoconf-2.72.tar.xz && cd autoconf-2.72
          ./configure && make -j4
          sudo make install
      - name: Install GNU Automake
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/automake/automake-1.18.tar.xz --retry 3
          tar -Jxf automake-1.18.tar.xz && cd automake-1.18
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libtool
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz --retry 3
          tar -Jxf libtool-2.5.4.tar.xz && cd libtool-2.5.4
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Pkgconf
        run: |
          curl -O https://distfiles.ariadne.space/pkgconf/pkgconf-2.5.1.tar.gz --retry 3
          tar -zxf pkgconf-2.5.1.tar.gz && cd pkgconf-2.5.1
          ./configure --disable-shared && make -j4
          sudo make install
          sudo ln -s /usr/local/bin/pkgconf /usr/local/bin/pkg-config
      - name: Install GNU Texinfo
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/texinfo/texinfo-7.3.tar.xz --retry 3
          tar -Jxf texinfo-7.3.tar.xz && cd texinfo-7.3
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libiconv
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/libiconv/libiconv-1.19.tar.gz --retry 3
          tar -zxf libiconv-1.19.tar.gz && cd libiconv-1.19
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libunistring
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz --retry 3
          tar -Jxf libunistring-1.4.2.tar.xz && cd libunistring-1.4.2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Gettext
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/gettext/gettext-0.26.tar.xz --retry 3
          tar -Jxf gettext-0.26.tar.xz && cd gettext-0.26
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Ncurses
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz --retry 3
          tar -zxf ncurses-6.6.tar.gz && cd ncurses-6.6
          ./configure --disable-shared && make -j4
          sudo make install
          sudo ln -s /usr/local/include/ncursesw/curses.h /usr/local/include/ncurses.h
      - name: Install Zlib
        run: |
          curl -LO https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz --retry 3
          tar -Jxf zlib-1.3.2.tar.xz && cd zlib-1.3.2
          ./configure --static && make -j4
          sudo make install
      - name: Install Libxml2
        run: |
          curl -O https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.2.tar.xz --retry 3
          tar -Jxf libxml2-2.15.2.tar.xz && cd libxml2-2.15.2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libgmp
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz --retry 3
          tar -Jxf gmp-6.3.0.tar.xz && cd gmp-6.3.0
          ./configure CFLAGS="-fPIC" --disable-assembly --disable-shared && make -j4
          sudo make install
      - name: Install Libnettle
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/nettle/nettle-4.0.tar.gz --retry 3
          tar -zxf nettle-4.0.tar.gz && cd nettle-4.0
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libidn2
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/libidn/libidn2-2.3.8.tar.gz --retry 3
          tar -zxf libidn2-2.3.8.tar.gz && cd libidn2-2.3.8
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GnuTLS
        run: |
          curl -O https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz --retry 3
          tar -Jxf gnutls-3.8.13.tar.xz && cd gnutls-3.8.13
          ./configure --disable-shared --with-included-libtasn1 --without-p11-kit && make -j4
          sudo make install
      - name: Install Libtreesitter
        run: |
          curl -LO https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.26.7.tar.gz --retry 3
          tar -zxf v0.26.7.tar.gz && cd tree-sitter-0.26.7
          make -j4
          sudo make install
          sudo find /usr/local/lib -name 'libtree-sitter*.dylib' -delete
      - name: Install GNU Gzip
        run: |
          curl -LO https://ftpmirror.gnu.org/gnu/gzip/gzip-1.14.tar.xz --retry 3
          tar -Jxf gzip-1.14.tar.xz && cd gzip-1.14
          ./configure && make -j4
          sudo make install
      - name: Install SQLite3
        run: |
          curl -O https://www.sqlite.org/2026/sqlite-autoconf-3510300.tar.gz
          tar -zxf sqlite-autoconf-3510300.tar.gz && cd sqlite-autoconf-3510300
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Emacs
        run: |
          git clone -b 'master' --depth 1 https://github.com/emacs-mirror/emacs.git
          cd emacs && sed -i '' '/darwin/ s/lncurses/lncursesw/g' configure.ac

          patch -p1 < ../patches/emacs-32/ns-mac-input-source.patch

          # patch -p1 < ../patches/emacs-31/ns-alpha-background.patch

          patch -p1 < ../patches/emacs-32/cursor-animation.patch

          ./autogen.sh && ./configure CFLAGS='-O2 -g0 -flto'          \
                                      PKG_CONFIG='pkgconf -static'    \
                                      --disable-gc-mark-trace         \
                                      --without-all                   \
                                      --with-compress-install         \
                                      --with-file-notification=kqueue \
                                      --with-gmp                      \
                                      --with-gnutls                   \
                                      --with-modules                  \
                                      --with-native-image-api         \
                                      --with-ns                       \
                                      --with-small-ja-dic             \
                                      --with-threads                  \
                                      --with-toolkit-scroll-bars      \
                                      --with-tree-sitter              \
                                      --with-xml2                     \
                                      --with-zlib                     \
                                      --with-sqlite3
          make -j4 && make install
          ditto nextstep/Emacs.app Emacs.app

          # rm leim
          # find . -name 'leim' -type d -exec rm -rf {} \;
          rm -rf Emacs.app/Contents/Resources/lisp/leim

          echo version=$(Emacs.app/Contents/MacOS/Emacs --version | sed -nE 's/^GNU Emacs ([0-9.]+).*/\1/p') >> $GITHUB_ENV
          echo commit_id=$(git log -1 --pretty=format:"%h") >> $GITHUB_ENV
          echo "NOW=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> $GITHUB_ENV

          build_version=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')"."$(git log -1 --pretty=format:"%h")"-"$(Emacs.app/Contents/MacOS/Emacs --version | sed -nE 's/^GNU Emacs ([0-9.]+).*/\1/p')"-master"
          echo build_version=${build_version} >> $GITHUB_ENV

          mv Emacs.app Emacs.${build_version}.app
          tar -Jcf Emacs.${build_version}.tar.xz Emacs.${build_version}.app

      - name: Generate release note commit info
        run: |

          cd emacs
          echo latest_log=$(git log -1 --oneline --pretty=format:"%h %an (%ad): %s" --date=iso) >> $GITHUB_ENV

      - name: Publish Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.build_version }}
          draft: false
          prerelease: false
          body: >
            Static build branch master of macOS Intel x86_64 Emacs app.


            ```
            ${{ env.latest_log }}
            ```


            Built with:
            [Github Workflow #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          files: |
            emacs/Emacs.${{ env.build_version }}.tar.xz
